<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1f10"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe285"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#805d26"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Background Circle / Shield Base -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(197, 160, 89, 0.25)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Stylized D20 Faces -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Center Triangle -->
    <polygon points="64,28 94,80 34,80" fill="rgba(197, 160, 89, 0.18)"/>
    
    <!-- Top & Side Facets -->
    <polygon points="64,28 94,80 102,48" fill="rgba(197, 160, 89, 0.1)"/>
    <polygon points="64,28 34,80 26,48" fill="rgba(197, 160, 89, 0.28)"/>
    <polygon points="64,28 102,48 64,18" fill="rgba(225, 29, 72, 0.2)"/>
    <polygon points="64,28 26,48 64,18" fill="rgba(225, 29, 72, 0.28)"/>
    
    <!-- Bottom Facets -->
    <polygon points="34,80 94,80 64,106" fill="rgba(197, 160, 89, 0.3)"/>
    <polygon points="94,80 102,48 106,78" fill="rgba(197, 160, 89, 0.12)"/>
    <polygon points="94,80 64,106 106,78" fill="rgba(197, 160, 89, 0.15)"/>
    <polygon points="34,80 26,48 22,78" fill="rgba(197, 160, 89, 0.22)"/>
    <polygon points="34,80 64,106 22,78" fill="rgba(197, 160, 89, 0.25)"/>
  </g>

  <!-- Central "20" Critical Engraving -->
  <text x="64" y="67" font-family="'Cinzel', 'Georgia', serif" font-size="20" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">20</text>
</svg>
