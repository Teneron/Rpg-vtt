<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="brassGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="60%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#4a3000"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#0f171e"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#111" stroke-width="4"/>

  <!-- Outer Brass Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#brassGrad)" stroke-width="8"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#222" stroke-width="2"/>

  <!-- Clockwork Gear Teeth -->
  <g fill="#b8860b">
    <rect x="94" y="6" width="12" height="10" rx="2"/>
    <rect x="94" y="184" width="12" height="10" rx="2"/>
    <rect x="6" y="94" width="10" height="12" rx="2"/>
    <rect x="184" y="94" width="10" height="12" rx="2"/>
    <rect x="36" y="36" width="12" height="10" rx="2" transform="rotate(45 42 41)"/>
    <rect x="152" y="152" width="12" height="10" rx="2" transform="rotate(45 158 157)"/>
    <rect x="152" y="36" width="12" height="10" rx="2" transform="rotate(-45 158 41)"/>
    <rect x="36" y="152" width="12" height="10" rx="2" transform="rotate(-45 42 157)"/>
  </g>

  <!-- Dual Clockwork Scythe Blades -->
  <path d="M 40 160 Q 60 70 125 45 Q 95 90 75 160 Z" fill="#e0e0e0" stroke="#888" stroke-width="2" filter="url(#glow)"/>
  <path d="M 160 160 Q 140 70 75 45 Q 105 90 125 160 Z" fill="#e0e0e0" stroke="#888" stroke-width="2" filter="url(#glow)"/>

  <!-- Inner Construct Core -->
  <circle cx="100" cy="110" r="45" fill="url(#brassGrad)" stroke="#333" stroke-width="4"/>
  <circle cx="100" cy="110" r="32" fill="#1a1a24" stroke="#d4af37" stroke-width="3"/>

  <!-- Wind Swirl Runes -->
  <path d="M 85 100 A 15 15 0 0 1 115 105 A 12 12 0 0 1 95 120 A 8 8 0 0 1 105 110" fill="none" stroke="#64d2ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Eyes / Sensors -->
  <circle cx="90" cy="92" r="5" fill="#64d2ff" filter="url(#glow)"/>
  <circle cx="110" cy="92" r="5" fill="#64d2ff" filter="url(#glow)"/>

  <!-- Subtle Rivets -->
  <circle cx="100" cy="72" r="2.5" fill="#443000"/>
  <circle cx="100" cy="148" r="2.5" fill="#443000"/>
  <circle cx="62" cy="110" r="2.5" fill="#443000"/>
  <circle cx="138" cy="110" r="2.5" fill="#443000"/>
</svg>
